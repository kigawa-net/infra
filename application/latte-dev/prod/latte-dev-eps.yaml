apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: latte-dev-eps
  namespace: kigawa-net-latte-dev
  labels:
    app.kubernetes.io/name: latte-dev
    kubernetes.io/service-name: latte-dev-svc
    endpointslice.kubernetes.io/managed-by: infra.kigawa.net
addressType: IPv4
ports:
  - name: websocket
    port: 8765
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.242
    conditions:
      ready: true
