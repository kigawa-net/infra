apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: latte-ai-vs
  namespace: latte
spec:
  hosts:
    - "latte-dev.kigawa.net"
  gateways:
    - latte-ai-gateway
  http:
    - route:
        - destination:
            host: latte-ai
            port:
              number: 8765
