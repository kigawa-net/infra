apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: latte-ai
  namespace: latte
  annotations:
    haproxy.org/ws-codes-to-proxy: "101"
spec:
  ingressClassName: haproxy
  rules:
    - host: latte-dev.kigawa.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: latte-ai
                port:
                  name: websocket
          - path: /debug
            pathType: Prefix
            backend:
              service:
                name: latte-ai
                port:
                  name: debug-http
