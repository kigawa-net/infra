# Prometheus scrape snippets for inuyama/alice WireGuard map.
# Merge these jobs into the existing Prometheus configuration.

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - 10.0.1.103:9100
          - 10.0.1.20:9100
          - 10.0.1.120:9100
          - 172.31.255.2:9100
        labels:
          site: inuyama-alice
    relabel_configs:
      - source_labels: [__address__]
        regex: 10\.0\.1\.103:9100
        target_label: instance
        replacement: k8s1
      - source_labels: [__address__]
        regex: 10\.0\.1\.20:9100
        target_label: instance
        replacement: k8s2
      - source_labels: [__address__]
        regex: 10\.0\.1\.120:9100
        target_label: instance
        replacement: k8s4
      - source_labels: [__address__]
        regex: 172\.31\.255\.2:9100
        target_label: instance
        replacement: alice-01

  - job_name: wireguard
    static_configs:
      - targets:
          - 10.0.1.120:9586
          - 172.31.255.2:9586
        labels:
          site: inuyama-alice
    relabel_configs:
      - source_labels: [__address__]
        regex: 10\.0\.1\.120:9586
        target_label: instance
        replacement: k8s4
      - source_labels: [__address__]
        regex: 172\.31\.255\.2:9586
        target_label: instance
        replacement: alice-01

  - job_name: blackbox-wireguard
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 172.31.255.1
          - 172.31.255.2
        labels:
          site: inuyama-alice
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-alice-backends
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 10.0.1.240:80
          - 10.0.1.240:443
          - 10.0.1.241:25565
        labels:
          site: inuyama-alice
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
