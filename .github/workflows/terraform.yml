name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'hardware/**'
  pull_request:
    paths:
      - 'platform/**'
      - 'hardware/**'
  workflow_dispatch:
    inputs:
      dir:
        description: 'ディレクトリ (platform or hardware)'
        required: true
        type: choice
        options:
          - platform
          - hardware
      module:
        description: 'モジュール名 (例: mcp-growi, alice, .)'
        required: true
        type: string
      command:
        description: 'terraform コマンド'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

jobs:
  detect-modules:
    # git diff/jqのみで内部ネットワークへの到達性が不要なため、
    # arc-runner-set-infra(worker1/4/5のメモリ逼迫でPendingになりがち、
    # issue #100)ではなくGitHub-hostedランナーを使う。
    # terraformジョブ自体はk8s1/k8s2/k8s4等プライベートIPへのSSHが
    # 必要なため、引き続きarc-runner-set-infra(内部ネットワーク到達可能)
    # のままにする。
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -q && sudo apt-get install -y -q jq

      - name: 変更されたモジュールを検出
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULES='[{"dir": "${{ inputs.dir }}", "module": "${{ inputs.module }}"}]'
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              DIFF_SPEC="origin/${{ github.base_ref }}...HEAD"
            else
              DIFF_SPEC="${{ github.event.before }} ${{ github.sha }}"
            fi
            
            # kinfra.kts/kinfra-parent.kts等のkinfra設定ファイルはterraformモジュール
            # ではないため、モジュール検出の対象から除外する
            EXCLUDE_PATTERN='\.kts$'

            # platform モジュールの検出（サブディレクトリのみが対象。
            # platform/直下のファイルはモジュールを持たないため対象外）
            PLATFORM_MODULES=$(git diff --name-only $DIFF_SPEC -- platform/ \
              | grep -v "$EXCLUDE_PATTERN" \
              | grep '^platform/[^/]\+/' | cut -d'/' -f2 | sort -u \
              | xargs -I {} echo '{"dir": "platform", "module": "{}"}')

            # hardware モジュールの検出
            # 1. サブディレクトリ (alice, k8s1, etc.)
            HARDWARE_SUB_MODULES=$(git diff --name-only $DIFF_SPEC -- hardware/ \
              | grep -v "$EXCLUDE_PATTERN" \
              | grep '^hardware/[^/]\+/' | cut -d'/' -f2 | grep -vE '^(modules|zones)$' | sort -u \
              | xargs -I {} echo '{"dir": "hardware", "module": "{}"}')

            # 2. 直下のファイル (main.tf, variables.tf, etc.)
            HARDWARE_ROOT_FILES=$(git diff --name-only $DIFF_SPEC -- hardware/ \
              | grep -v "$EXCLUDE_PATTERN" \
              | grep '^hardware/[^/]\+$' | wc -l)
            if [ "$HARDWARE_ROOT_FILES" -gt 0 ]; then
              HARDWARE_ROOT_MODULE='{"dir": "hardware", "module": "."}'
            else
              HARDWARE_ROOT_MODULE=""
            fi

            # hardware/modules/<name> が変更された場合、実際に
            # source = "../modules/<name>" を参照しているモジュールだけを
            # 実行対象に追加する (hardware/. を含む未使用モジュールを
            # 誤って巻き込まないようにするため)
            CHANGED_SHARED_MODULES=$(git diff --name-only $DIFF_SPEC -- hardware/modules/ \
              | grep -v "$EXCLUDE_PATTERN" \
              | grep '^hardware/modules/[^/]\+/' | cut -d'/' -f3 | sort -u)

            HARDWARE_MODULE_CONSUMERS=""
            for shared_module in $CHANGED_SHARED_MODULES; do
              CONSUMER_FILES=$(grep -rlE "source[[:space:]]*=[[:space:]]*\"\.\./modules/${shared_module}\"" hardware --include="*.tf" \
                | grep -v '^hardware/modules/')
              for f in $CONSUMER_FILES; do
                rel="${f#hardware/}"
                if [ "$rel" = "main.tf" ]; then
                  mod="."
                else
                  mod="${rel%%/*}"
                fi
                HARDWARE_MODULE_CONSUMERS="${HARDWARE_MODULE_CONSUMERS}\n{\"dir\": \"hardware\", \"module\": \"$mod\"}"
              done
            done
            HARDWARE_MODULE_CONSUMERS=$(echo -e "$HARDWARE_MODULE_CONSUMERS" | grep -v '^$' | sort -u)

            # hardware/zones/<file> が変更された場合、実際に
            # file("${path.module}/../zones/<file>") を参照しているモジュールだけを
            # 実行対象に追加する (hardware/modules/ の consumer 検出と同じパターン)
            CHANGED_ZONE_FILES=$(git diff --name-only $DIFF_SPEC -- hardware/zones/ \
              | grep -v "$EXCLUDE_PATTERN" \
              | grep '^hardware/zones/[^/]\+$' | xargs -r -n1 basename | sort -u)

            HARDWARE_ZONE_CONSUMERS=""
            for zone_file in $CHANGED_ZONE_FILES; do
              CONSUMER_FILES=$(grep -rlE "zones/${zone_file}" hardware --include="*.tf" \
                | grep -v '^hardware/zones/')
              for f in $CONSUMER_FILES; do
                rel="${f#hardware/}"
                if [ "$rel" = "main.tf" ]; then
                  mod="."
                else
                  mod="${rel%%/*}"
                fi
                HARDWARE_ZONE_CONSUMERS="${HARDWARE_ZONE_CONSUMERS}\n{\"dir\": \"hardware\", \"module\": \"$mod\"}"
              done
            done
            HARDWARE_ZONE_CONSUMERS=$(echo -e "$HARDWARE_ZONE_CONSUMERS" | grep -v '^$' | sort -u)

            MODULES=$(echo -e "${PLATFORM_MODULES}\n${HARDWARE_SUB_MODULES}\n${HARDWARE_ROOT_MODULE}\n${HARDWARE_MODULE_CONSUMERS}\n${HARDWARE_ZONE_CONSUMERS}" \
              | grep -v '^$' | sort -u | jq -sc .)
          fi

          # k8s1/k8s2/k8s4/ionosはionosに登録した専用WireGuardピア経由で
          # GitHub-hosted runner(ubuntu-latest)から到達できるようにした
          # (issue #100対策)。それ以外のモジュール(alice, k8s-worker3/5,
          # cloudflare, ルートの"."等)は実IPが192.168.1.x(自宅LAN)固定で
          # トンネル経由では到達できないため、引き続きarc-runner-set-infra
          # (自己ホストランナー、自宅LANに直接接続)を使う。
          GITHUB_HOSTED_MODULES="k8s1 k8s2 k8s4 ionos"
          MODULES=$(echo "$MODULES" | jq -c --arg gh "$GITHUB_HOSTED_MODULES" '
            ($gh | split(" ")) as $gh_list
            | map(. + {runner: (if (.module as $m | $gh_list | index($m)) then "ubuntu-latest" else "arc-runner-set-infra" end)})
          ')
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "検出されたモジュール: $MODULES"

  terraform:
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != '[]' && needs.detect-modules.outputs.modules != ''
    # k8s1/k8s2/k8s4/ionosはionosに登録した専用WireGuardピア経由で
    # ubuntu-latest(GitHub-hosted)からも到達できるようにしたため、
    # arc-runner-set-infra(自己ホストランナー、worker1/4/5のメモリ逼迫で
    # Pendingのまま進まないことが多い、issue #100)を避けられる。
    # それ以外のモジュール(alice, k8s-worker3/5等)は実IPが192.168.1.x
    # (自宅LAN)固定でトンネル経由では到達できないため、detect-modulesが
    # 出力するmatrix.runnerで自己ホストランナーのままにする。
    runs-on: ${{ matrix.runner }}
    strategy:
      max-parallel: 1
      # 2026-09-23のインシデントで、k8s1のapply失敗によりk8s2/k8s4がfail-fastで
      # キャンセルされ、後続ノードの独立した成否が見えなくなった(k8s2は
      # 実際には成功する可能性があった)。1ノードの障害が他ノードの復旧作業を
      # 妨げないよう、各モジュールを最後まで実行させる。
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q jq unzip curl

      - name: Install bws CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # bitwarden/sdk-sm hosts releases for multiple SDKs (bws, python, napi, ...) in one
          # repo, so /releases/latest can return a non-bws release (e.g. python-v2.1.0) depending
          # on publish order. Find the most recent release actually tagged bws-v* instead.
          BWS_VERSION=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/bitwarden/sdk-sm/releases?per_page=30" \
            | jq -r '[.[] | select(.tag_name | startswith("bws-v"))][0].tag_name')
          BWS_TAG=${BWS_VERSION#bws-v}
          curl -Lo bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/${BWS_VERSION}/bws-x86_64-unknown-linux-gnu-${BWS_TAG}.zip"
          unzip bws.zip bws
          sudo mv bws /usr/local/bin/
          bws --version

      # k8s1/k8s2/k8s4はプライベートIP(10.0.0.0/24)のみでubuntu-latestから
      # 直接到達できないため、ionosに事前登録した専用WireGuardピア
      # (kigawa-infra-ci-runner, 172.31.254.21)経由でトンネルを張る。
      # ionosモジュール自体は自己のパブリックIP(74.208.55.86)へ直接SSHするが、
      # ionosのTerraformコードはk8s1/k8s2の公開鍵取得のため10.0.0.103/10.0.0.120へ
      # SSHするdata "external"を持っており、これもubuntu-latestからのトンネルが
      # 必要なため、ionosモジュールもこのステップの対象に含める。
      - name: WireGuardトンネルを張る (k8s1/k8s2/k8s4到達のため)
        if: matrix.runner == 'ubuntu-latest'
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          sudo apt-get install -y -q wireguard
          PRIVATE_KEY=$(bws -c no secret get 5eeb43e8-4973-47f8-8bfe-b4ce0047b568 | jq -r '.value')
          sudo install -d -m 700 /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf > /dev/null <<WG_EOF
          [Interface]
          Address = 172.31.254.21/24
          PrivateKey = ${PRIVATE_KEY}

          [Peer]
          PublicKey = OH5QiXaMfpmH8nHVU1Onnfom4BZcq4zx5Ux6R6R4LR0=
          AllowedIPs = 172.31.254.0/24, 10.0.0.0/24
          Endpoint = 74.208.55.86:51820
          PersistentKeepalive = 25
          WG_EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          # WireGuardのハンドシェイクは初回パケット送信時に遅延して確立するため、
          # 即座にpingすると間に合わないことがある。疎通確認はリトライしつつ、
          # 実際の疎通に失敗してもここではジョブを止めない(本当のテストは後続の
          # terraform init/plan/applyでのSSH接続そのもの)。
          for i in $(seq 1 10); do
            if ping -c 1 -W 2 10.0.0.100; then
              echo "10.0.0.100 reachable"
              break
            fi
            echo "retry $i..."
            sleep 2
          done
          sudo wg show

      # ionos は soichiro(OneServerMC/infraへ移設済み)のWireGuardゲートウェイであり、
      # soichiroの公開鍵取得にCloudflare Tunnel経由のSSHを要求するため
      # terraform実行環境にcloudflaredが必要。
      - name: cloudflared をインストール (ionos用)
        if: matrix.module == 'ionos'
        run: |
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          # The default Node-based CLI wrapper isn't usable here — this self-hosted
          # runner (arc-runner-set-infra) doesn't have node on PATH, so `terraform`
          # would fail with "env: 'node': No such file or directory". Plan/apply
          # work identically without the wrapper; it only adds output-parsing sugar.
          terraform_wrapper: false

      # BWS_ACCESS_TOKEN is read by the `bws` CLI inside run.sh (to fetch other secrets);
      # BW_ACCESS_TOKEN is the env var the `bitwarden/bitwarden-secrets` Terraform provider
      # itself expects (it replaced the now-defunct `bitwarden-labs/bitwarden-sm` provider,
      # which used a different, un-namespaced env var convention). Same underlying token.
      - name: Terraform Init
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BW_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: ./${{ matrix.dir }}/run.sh ${{ matrix.module }} init -input=false

      - name: Terraform Plan
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BW_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          ./${{ matrix.dir }}/run.sh ${{ matrix.module }} plan -input=false -no-color -out=tfplan \
            2>&1 | tee plan_output.txt

      - name: PR にプランをコメント
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = output.length > 60000
              ? output.slice(0, 60000) + '\n\n...(出力が長いため省略)'
              : output;
            const header = `### Terraform Plan \`${{ matrix.dir }}/${{ matrix.module }}\``;
            // "diff" 言語指定にすると、+/-で始まる行がGitHub上で緑/赤にハイライトされる
            // (planの出力する+/-/~がdiff表記とほぼ一致するため、素の```より読みやすくなる)。
            const body = `${header}\n\`\`\`diff\n${truncated}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(header)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Terraform Apply
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.command == 'apply')
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BW_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: ./${{ matrix.dir }}/run.sh ${{ matrix.module }} apply -input=false tfplan

      - name: WireGuardトンネルを閉じる (k8s1/k8s2/k8s4到達用)
        if: always() && matrix.runner == 'ubuntu-latest'
        run: sudo wg-quick down wg0 || true
